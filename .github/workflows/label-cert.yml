# When an issue form is opened, adds its cert label (e.g. "cwes"), plus "vault" for prep vault issues.
name: Label issues
on:
  issues:
    types: [opened]  # label once; later edits and manual triage are left alone
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            // read only the form's own fields: the line right after each heading
            const field = (h) => { const m = body.match(new RegExp("^### " + h + "[ \\t]*[\\r\\n]+([^\\r\\n]+)", "m")); return m ? m[1].trim() : ""; };
            const certs = ["cjca","cpts","cwes","cwee","cdsa","cape","cwpe","coae"];
            const c = field("Cert").toLowerCase();
            const labels = certs.includes(c) ? [c] : [];
            // suggest form: "Where should it go"; problem form: "Where" (required, so the form's own field matches first)
            if ((field("Where should it go") || field("Where")).startsWith("Prep vault")) labels.push("vault");
            if (labels.length) {
              await github.rest.issues.addLabels({...context.repo, issue_number: context.payload.issue.number, labels});
            }
