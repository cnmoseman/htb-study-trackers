<!DOCTYPE html>

<meta name="robots" content="noindex">

<title>Page not found · Study Trackers</title>
<meta name="theme-color" content="#9fef00">
<script>
  // /CPTS, /cpts.html, /cpts/foo -> /cpts/ ; unknown or already tried -> landing
  (function () {
    var p = location.pathname.split("/");
    var base = "/" + p[1] + "/", seg = (p[2] || "").split(".")[0].toLowerCase();
    var tried = p.length === 4 && p[3] === "" && p[2] === seg;
    location.replace(base + (seg && !tried ? seg + "/" + location.hash : ""));
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/htb-study-trackers/"></noscript>

  html,body{margin:0;height:100%;background:#141d2b;color:#a4b1cd;font:15px/1.5 system-ui,sans-serif}

  a{color:#9fef00}
</style>
</head>
